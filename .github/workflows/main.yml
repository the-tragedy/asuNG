name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias mykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -storepass mypassword123 \
            -keypass mypassword123 \
            -dname "CN=MyVPN, OU=Dev, O=MyOrg, L=City, S=State, C=US"
          base64 keystore.jks > keystore_base64.txt
          cat keystore_base64.txt

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore_base64.txt
